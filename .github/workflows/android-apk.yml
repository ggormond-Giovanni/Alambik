name: Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Identify build
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "APK_NAME=alambik-${SHORT_SHA}.apk" >> "$GITHUB_ENV"
          sed -i "s/DEV LOCAL/DEV ${SHORT_SHA}/" scenes/menu.tscn

      - name: Remove stale phone release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release delete dev-latest --yes --cleanup-tag
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Godot 4.7.1
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.1-stable
          csharp: false
          export-templates: true

      - name: Import project
        run: godot --headless --path . --import

      - name: Verify project
        env:
          GODOT: godot
        run: ./verifier.sh

      - name: Capture UI on common phone ratios
        continue-on-error: true
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          mkdir -p build/screenshots

          capture() {
            WIDTH="$1"
            HEIGHT="$2"
            NAME="$3"
            timeout 30s xvfb-run -a -s "-screen 0 ${WIDTH}x${HEIGHT}x24" \
              godot --path . --windowed --resolution "${WIDTH}x${HEIGHT}" \
              -- --capture="${GITHUB_WORKSPACE}/build/screenshots/${NAME}.png" --capture-apres=2.2
          }

          capture 1080 1920 menu-1080x1920
          capture 1080 2340 menu-1080x2340
          capture 1080 2400 menu-1080x2400
          capture 1080 2520 menu-1080x2520

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alambik-ui-screenshots-${{ github.sha }}
          path: build/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Export debug APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" "build/${APK_NAME}"
          test -s "build/${APK_NAME}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: alambik-apk-${{ github.sha }}
          path: build/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified phone build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES="APK debug vérifiée de la branche master. Commit: ${GITHUB_SHA}. Le menu doit afficher DEV ${SHORT_SHA}. Construite avec Godot 4.7.1."
          gh release create dev-latest "build/${APK_NAME}" \
            --target "$GITHUB_SHA" \
            --title "Alambik - DEV ${SHORT_SHA}" \
            --notes "$NOTES" \
            --prerelease
