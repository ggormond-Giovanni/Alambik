<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Icone d'Alambic : une cornue d'alchimiste sur une page sombre. Dessinee
       ici plutot qu'importee : rien dans ce depot ne vient d'ailleurs. -->
  <defs>
    <radialGradient id="lueur" cx="50%" cy="62%" r="52%">
      <stop offset="0%" stop-color="#c795ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c795ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liquide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7a6ff"/>
      <stop offset="100%" stop-color="#7b4fd8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="#0e0c13"/>
  <rect x="34" y="34" width="444" height="444" rx="70" fill="#1b1626"/>
  <rect x="34" y="34" width="444" height="444" rx="70" fill="none" stroke="#3c314d" stroke-width="6"/>

  <circle cx="256" cy="318" r="170" fill="url(#lueur)"/>

  <!-- Ballon de la cornue -->
  <circle cx="256" cy="318" r="112" fill="#b8c6dd" fill-opacity="0.16"/>
  <path d="M148 340a108 108 0 0 0 216 0z" fill="url(#liquide)" fill-opacity="0.9"/>
  <path d="M148 340q54 -26 108 0 t108 0" fill="none" stroke="#e5cdff" stroke-width="7" stroke-opacity="0.8"/>
  <circle cx="256" cy="318" r="112" fill="none" stroke="#dce6f5" stroke-width="9" stroke-opacity="0.55"/>

  <!-- Col et bec -->
  <rect x="228" y="132" width="56" height="96" rx="12" fill="#b8c6dd" fill-opacity="0.22"/>
  <rect x="228" y="132" width="56" height="96" rx="12" fill="none" stroke="#dce6f5" stroke-width="8" stroke-opacity="0.5"/>
  <path d="M282 176 L392 232" fill="none" stroke="#dce6f5" stroke-width="14" stroke-opacity="0.5" stroke-linecap="round"/>
  <rect x="214" y="112" width="84" height="26" rx="13" fill="#dce6f5" fill-opacity="0.6"/>

  <!-- Bulles -->
  <circle cx="222" cy="300" r="13" fill="#ffffff" fill-opacity="0.45"/>
  <circle cx="288" cy="268" r="9" fill="#ffffff" fill-opacity="0.35"/>
  <circle cx="262" cy="230" r="6" fill="#ffffff" fill-opacity="0.28"/>

  <!-- Goutte d'or : l'essence qui tombe -->
  <path d="M400 96c14 22 22 34 22 44a22 22 0 0 1-44 0c0-10 8-22 22-44z" fill="#fbd16b"/>
</svg>
